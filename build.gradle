plugins {
    id 'java'
    id 'application'
    id 'com.github.johnrengelman.shadow' version '7.1.2'
}

group = 'com.orderprocessing'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'io.vertx:vertx-core:4.5.0'
    implementation 'io.vertx:vertx-web:4.5.0'
    implementation 'io.vertx:vertx-pg-client:4.5.0'
    implementation 'io.vertx:vertx-config:4.5.0'
    
    implementation 'com.ongres.scram:client:2.1'
    
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.2'
    
    implementation 'org.slf4j:slf4j-api:2.0.7'
    implementation 'ch.qos.logback:logback-classic:1.4.8'
    
    testImplementation 'io.vertx:vertx-junit5:4.5.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    testImplementation 'org.testcontainers:postgresql:1.19.1'
    testImplementation 'org.testcontainers:junit-jupiter:1.19.1'
}

application {
    mainClass = 'com.orderprocessing.Main'
}

shadowJar {
    archiveBaseName = 'async-order-processing-service'
    archiveVersion = ''
    archiveClassifier = ''
    mergeServiceFiles()
    configurations = [project.configurations.runtimeClasspath]
}

build.dependsOn shadowJar

test {
    useJUnitPlatform()
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

